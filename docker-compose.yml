services:
  postgres:
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Please set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ghidra:
    # Upstream Ghidra REST API service (provides /v1/* API)
    # Pinned to immutable digest: the tag alone can be moved by its publisher.
    image: biniamfd/ghidra-headless-rest:1.2.1@sha256:971591a3a8448d8ed969079b452306e806f36079c3ddd298f4a618d6e2f1442d
    security_opt:
      - "no-new-privileges:true"
    volumes:
      - ghidra-data:/data/ghidra_projects
    environment:
      MAX_CONCURRENT_ANALYSES: "1"
      MAX_UPLOAD_SIZE: "536870912"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9090/v1/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  ghidra-webui:
    # Ghidra WebUI (Flask app) - runs on port 5000, talks to ghidra:9090
    build:
      context: .
      dockerfile: docker/ghidra.Dockerfile
    image: artex-ghidra-webui:local
    security_opt:
      - "no-new-privileges:true"
    volumes:
      - ghidra-data:/data/ghidra_projects
    environment:
      GHIDRA_API_BASE: http://ghidra:9090
      CHATS_DIR: /data/chats
      HOST: 0.0.0.0
      PORT: 5000
      DEBUG: false
      LOG_LEVEL: INFO
      GUNICORN_BIND: "0.0.0.0:5000"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:5000/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  opentrap:
    build:
      context: .
      dockerfile: docker/opentrap.Dockerfile
    image: artex-opentrap:local
    security_opt:
      - "no-new-privileges:true"
    volumes:
      - opentrap-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8081/v1/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  artex:
    build:
      context: .
      args:
        ARTEX_VERSION: ${ARTEX_VERSION:-dev}
    image: artex:local
    security_opt:
      - "no-new-privileges:true"
    depends_on:
      postgres:
        condition: service_healthy
      ghidra:
        condition: service_healthy
      opentrap:
        condition: service_healthy
    environment:
      ARTEX_PG_HOST: postgres
      ARTEX_PG_PORT: "5432"
      ARTEX_PG_USER: ${POSTGRES_USER:-artex}
      ARTEX_PG_PASSWORD: ${POSTGRES_PASSWORD:?Please set POSTGRES_PASSWORD in .env}
      ARTEX_PG_DBNAME: ${POSTGRES_DB:-artex}
      ARTEX_PG_SSLMODE: disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
      ARTEX_LLM_PRIVATE_ENDPOINTS: ${ARTEX_LLM_PRIVATE_ENDPOINTS:-}
      ARTEX_JWT_KEY_DIR: /app/keys
      ARTEX_SECRET_KEY: ${ARTEX_SECRET_KEY:-}
      ARTEX_TRUSTED_PROXIES: ${ARTEX_TRUSTED_PROXIES:-}
      ARTEX_UNTRUSTED_BOUNDARY: ${ARTEX_UNTRUSTED_BOUNDARY:-}
      ARTEX_UPDATE_CHECK: ${ARTEX_UPDATE_CHECK:-}
      ARTEX_NOISE_PROFILE: ${ARTEX_NOISE_PROFILE:-}
      ARTEX_TARGET_USER_AGENT: ${ARTEX_TARGET_USER_AGENT:-}
      ARTEX_TASK_BUDGET_TOKENS: ${ARTEX_TASK_BUDGET_TOKENS:-}
      ARTEX_TASK_BUDGET_TURNS: ${ARTEX_TASK_BUDGET_TURNS:-}
      ARTEX_INTENT_BUDGET_TOKENS: ${ARTEX_INTENT_BUDGET_TOKENS:-}
      ARTEX_INTENT_BUDGET_TURNS: ${ARTEX_INTENT_BUDGET_TURNS:-}
      # Sidecar URLs (ghidra-api service provides /v1/* API)
      ARTEX_GHIDRA_URL: http://ghidra:9090
      ARTEX_GHIDRA_API_KEY: ${ARTEX_GHIDRA_API_KEY:-}
      ARTEX_OPENTRAP_URL: http://opentrap:8081
      ARTEX_OPENTRAP_API_KEY: ${ARTEX_OPENTRAP_API_KEY:-}
    ports:
      - "${ARTEX_BIND_ADDR:-127.0.0.1}:8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      - ./data:/app/data
      - ./keys:/app/keys
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
  ghidra-data:
  opentrap-data: