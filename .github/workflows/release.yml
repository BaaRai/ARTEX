name: release
on:
  push:
    tags: ["v*"]
  # Dry run: builds, SBOM, attestations and workflow artifacts only. The GitHub
  # Release and the image push are gated on github.event_name == 'push'.
  workflow_dispatch:

permissions:
  contents: write # required to create the Release

jobs:
  # ① Frontend static export (once), reused by the cross-compiled platform builds
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build:static
        working-directory: web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-dist
          path: web/out

  # ② Cross-compile for five platforms (with embedded frontend) + zip packaging
  binaries:
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-dist
          path: server/webui/dist
      - name: Build and package with build.sh
        env:
          ARTEX_TARGET_OS: ${{ matrix.goos }}
          ARTEX_TARGET_ARCH: ${{ matrix.goarch }}
          ARTEX_BUILD_VERSION: ${{ github.ref_name }}
          ARTEX_SKIP_FRONTEND: "1"
          ARTEX_SKIP_NPM_CI: "1"
          # UPX self-extracting ELF binaries crash on some Linux kernels, virtualization
          # setups, and security policies. Releases use Go linker trimming and zip
          # compression, prioritizing portability.
          ARTEX_COMPRESS: "0"
          ARTEX_PACKAGE: "1"
          ARTEX_PACKAGE_DIR: dist
        run: |
          ./build.sh --target "${ARTEX_TARGET_OS}/${ARTEX_TARGET_ARCH}"
      - name: Smoke test Linux amd64 binary
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: dist/artex-linux-amd64/artex -h
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "dist/*.zip"
      # Upload the raw linux/amd64 binary separately for the release job's Syft SBOM scan
      - if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bin-linux-amd64
          path: dist/artex-linux-amd64/artex

  # ③ Collect all zips → create the GitHub Release
  release:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the Release (softprops/action-gh-release)
      id-token: write # Sigstore signing of the provenance attestation
      attestations: write # store the attestation on the repository
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 — CHANGELOG.md and the extractor script
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.zip > SHA256SUMS
      # SBOM of what ships: the Go modules embedded in the linux/amd64 binary, plus
      # the frontend lockfile and the Go module files.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bin-linux-amd64
          path: ${{ runner.temp }}/sbom-src/bin
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        id: syft
        with:
          syft-version: v1.54.0
      - name: Generate CycloneDX SBOM
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          SRC: ${{ runner.temp }}/sbom-src
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p "$SRC/web"
          cp go.mod go.sum "$SRC/"
          cp web/package-lock.json "$SRC/web/"
          sbom="dist/artex-${TAG}.cdx.json"
          "$SYFT" scan "dir:$SRC" --source-name artex --source-version "$TAG" -o "cyclonedx-json=$sbom"
          grep -q '"pkg:golang/' "$sbom" || { echo "::error::SBOM has no pkg:golang entries"; exit 1; }
          grep -q '"pkg:npm/' "$sbom" || { echo "::error::SBOM has no pkg:npm entries"; exit 1; }
          echo "SBOM_PATH=$sbom" >> "$GITHUB_ENV"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-metadata
          path: |
            dist/SHA256SUMS
            ${{ env.SBOM_PATH }}
      - name: Release body from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if bash scripts/extract-changelog-section.sh "$version" CHANGELOG.md > "$RUNNER_TEMP/release-body.md"; then
            echo "Release body: CHANGELOG.md section [$version]"
          else
            echo "::warning::CHANGELOG.md has no section [$version]; using the generic release body"
            echo "Release $TAG. See CHANGELOG.md for the list of changes in this release." > "$RUNNER_TEMP/release-body.md"
          fi
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        if: github.event_name == 'push'
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS
            ${{ env.SBOM_PATH }}
          generate_release_notes: false
          body_path: ${{ runner.temp }}/release-body.md

  # ④ Multi-arch image → push to GitHub Container Registry (and optionally Docker Hub
  #    when DOCKERHUB_ENABLED is set to 'true' alongside DOCKERHUB_IMAGE and
  #    DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets). Dry runs (workflow_dispatch)
  #    build both platforms without logging in or pushing.
  docker:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && vars.DOCKERHUB_ENABLED == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ vars.DOCKERHUB_ENABLED == 'true' && vars.DOCKERHUB_IMAGE || '' }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ARTEX_VERSION=${{ github.ref_name }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A brand-new GHCR package starts private: the push succeeds, but an
      # anonymous pull is denied until the package visibility is set to Public.
      # Use an empty Docker config so the registry login above cannot mask it.
      - name: Verify the image pulls anonymously
        if: github.event_name == 'push'
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          tag="${GITHUB_REF_NAME}"
          cfg="$(mktemp -d)"
          for attempt in 1 2 3; do
            if DOCKER_CONFIG="$cfg" docker manifest inspect "ghcr.io/${repo}:${tag}" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "anonymous pull of ghcr.io/${repo}:${tag} is denied; set the package visibility to Public" >&2
          exit 1
